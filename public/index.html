<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sattva — Implementação da Reforma Tributária</title>
<link rel="icon" href="img/logo_sattva.jpg">
<link rel="stylesheet" href="css/app.css">
<script>try{if(localStorage.getItem('sattva_tema')==='escuro')document.documentElement.classList.add('tema-escuro')}catch(_){}</script>
</head>
<body>
<div class="app" id="appShell">
  <aside class="lateral">
    <div class="marca"><button class="menu-toggle" id="menuToggle" aria-label="Recolher menu">☰</button>
      <img src="img/logo_sattva.jpg" alt="Sattva">
      <div class="produto">Reforma Tributária</div>
      <div class="sub">Diagnóstico, adequação e margem</div>
    </div>
    <div class="empresa-ativa">
      <label for="seletorEmpresa">Empresa em análise</label>
      <select id="seletorEmpresa"></select>
      <button class="cnpj-empresa-ativa" id="copiarCnpjEmpresa" type="button" title="Copiar CNPJ da empresa selecionada" aria-label="Copiar CNPJ da empresa selecionada"></button>
    </div>
    <nav id="menu"></nav>
  </aside>
  <section class="area-app"><header class="app-header"><div><span class="crumb">Sattva · Reforma Tributária</span><strong id="tituloContexto">Visão geral</strong></div><div class="header-acoes"><select id="seletorEmpresaHeader" aria-label="Empresa em análise"></select><button class="header-btn" id="abrirAtualizacoes" type="button">Atualizações<span id="badgeAtualizacoes" class="badge-notificacao" hidden>0</span></button><button class="header-btn" id="abrirUtilidadesFiscais" type="button">Utilidades</button><div class="usuario-menu"><button class="usuario-header" id="usuarioHeader" type="button" aria-expanded="false"></button><div class="usuario-menu-itens" id="usuarioMenuItens" hidden><div class="menu-aparencia"><span>Aparência</span><button type="button" data-tema="claro">☀ Claro</button><button type="button" data-tema="escuro">☾ Escuro</button></div><button type="button" data-manual-header>Manuais do sistema</button><button type="button" data-redefinir-header>Redefinir senha</button><button type="button" data-sair-header>Sair</button></div></div></div></header><main class="conteudo" id="tela"><div class="carregando">Carregando…</div></main></section>
</div>
<div id="modais"></div>
<script>
(async () => {
  // Cada abertura consulta o commit que está realmente Live e usa essa versão
  // na URL dos scripts. Isso impede uma aba/navegador de combinar HTML antigo
  // com a API de um deploy novo.
  const status = await fetch('/auth/status', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({}));
  const versao = encodeURIComponent(status.commit_render || String(Date.now()));
  const arquivos = ['app','telas','telas2','telas3','telas4','telas5','telas6','telas7','telas8'];
  for (const arquivo of arquivos) await new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = `js/${arquivo}.js?v=${versao}`;
    script.onload = resolve;
    script.onerror = () => reject(new Error(`Não foi possível carregar ${arquivo}.js da versão ${versao}.`));
    document.body.appendChild(script);
  });
  App.iniciar();
})().catch((erro) => {
  const tela = document.getElementById('tela');
  if (tela) tela.innerHTML = `<div class="aviso atencao"><b>Atualização incompleta.</b> ${String(erro.message || erro)}</div>`;
});
</script>
</body>
</html>
